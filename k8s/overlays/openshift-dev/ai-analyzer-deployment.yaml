apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyzer-service
  namespace: banking-app
  labels:
    app: ai-analyzer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-analyzer-service
  template:
    metadata:
      labels:
        app: ai-analyzer-service
        version: v1
        mesh-scope: critical
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-analyzer-service
          image: bankingappdev.azurecr.io/ai-analyzer-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: banking-app-config
            - secretRef:
                name: banking-app-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
