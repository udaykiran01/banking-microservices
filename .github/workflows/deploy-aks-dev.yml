name: Deploy AKS Dev

on:
  push:
    branches:
      - main
    paths:
      - "api-service/**"
      - "worker-service/**"
      - "ai-analyzer-service/**"
      - "fraud-service/**"
      - "fraud-dashboard/**"
      - "frontend/**"
      - "openshift-azure-terraform/helm-charts/banking-app/**"
      - ".github/workflows/deploy-aks-dev.yml"

env:
  ACR_NAME: bankingacrdev
  AKS_RESOURCE_GROUP: rg-banking-dev
  AKS_CLUSTER_NAME: aks-banking-dev
  NAMESPACE: banking-dev

jobs:
  deploy-aks-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and Push API Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/banking-api:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/banking-api:dev \
            ./api-service
          docker push $ACR_NAME.azurecr.io/banking-api:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/banking-api:dev

      - name: Build and Push Worker Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/worker-service:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/worker-service:dev \
            ./worker-service
          docker push $ACR_NAME.azurecr.io/worker-service:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/worker-service:dev

      - name: Build and Push AI Analyzer Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/ai-analyzer-service:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/ai-analyzer-service:dev \
            ./ai-analyzer-service
          docker push $ACR_NAME.azurecr.io/ai-analyzer-service:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/ai-analyzer-service:dev

      - name: Build and Push Fraud Service Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/fraud-service:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/fraud-service:dev \
            ./fraud-service
          docker push $ACR_NAME.azurecr.io/fraud-service:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/fraud-service:dev

      - name: Build and Push Fraud Dashboard Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/fraud-dashboard:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/fraud-dashboard:dev \
            ./fraud-dashboard
          docker push $ACR_NAME.azurecr.io/fraud-dashboard:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/fraud-dashboard:dev

      - name: Build and Push Frontend Image
        run: |
          docker build \
            -t $ACR_NAME.azurecr.io/frontend-service:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/frontend-service:dev \
            ./frontend
          docker push $ACR_NAME.azurecr.io/frontend-service:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/frontend-service:dev

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group $AKS_RESOURCE_GROUP \
            --name $AKS_CLUSTER_NAME \
            --overwrite-existing

      - name: Create Namespace
        run: kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install banking-app openshift-azure-terraform/helm-charts/banking-app \
            --namespace $NAMESPACE \
            --create-namespace \
            -f openshift-azure-terraform/helm-charts/banking-app/values-dev.yaml \
            --set apiService.image.tag=${{ github.sha }} \
            --set workerService.image.tag=${{ github.sha }} \
            --set aiAnalyzerService.image.tag=${{ github.sha }} \
            --set fraudService.image.tag=${{ github.sha }} \
            --set dashboardService.image.tag=${{ github.sha }} \
            --set frontendService.image.tag=${{ github.sha }}

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/api-service -n $NAMESPACE
          kubectl rollout status deployment/worker-service -n $NAMESPACE
          kubectl rollout status deployment/ai-analyzer-service -n $NAMESPACE
          kubectl rollout status deployment/fraud-service -n $NAMESPACE
          kubectl rollout status deployment/fraud-dashboard -n $NAMESPACE
          kubectl rollout status deployment/frontend-service -n $NAMESPACE

      - name: Upload Deployment Evidence
        uses: actions/upload-artifact@v4
        with:
          name: aks-deployment-evidence
          path: openshift-azure-terraform/helm-charts/banking-app/
