name: Terraform Plan

on:
  push:
    branches:
      - main
      - test-terraform-pipeline
    paths:
      - "openshift-azure-terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write   

- name: Azure Login using OIDC
  uses: azure/login@v2
  with:
    client-id: ${{ vars.AZURE_CLIENT_ID }}
    tenant-id: ${{ vars.AZURE_TENANT_ID }}
    subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}     

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: openshift-azure-terraform/infra/live/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Terragrunt
        run: |
          TG_VERSION=0.82.3
          wget -O terragrunt https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/

      - name: Verify Terragrunt
        run: terragrunt --version

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: openshift-azure-terraform

      - name: Terragrunt Init All
        run: terragrunt run-all init --non-interactive

      - name: Terragrunt Validate All
        run: terragrunt run-all validate --non-interactive

      - name: Terragrunt Plan All
        run: terragrunt run-all plan --non-interactive

      - name: Upload Terraform Plan Evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-evidence
          path: openshift-azure-terraform/infra/live/dev/tfplan