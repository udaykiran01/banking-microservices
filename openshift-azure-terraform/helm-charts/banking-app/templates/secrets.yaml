{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.existingSecret }}
  namespace: {{ include "banking-app.namespace" . }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secrets.database }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.azureOpenAI.existingSecret }}
  namespace: {{ include "banking-app.namespace" . }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secrets.azureOpenAI }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
