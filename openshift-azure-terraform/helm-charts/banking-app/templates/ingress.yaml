{{- if .Values.ingress.enabled }}
{{- $ns := include "banking-app.namespace" . }}
{{- $host := .Values.ingress.host }}
{{- $apiAnnotations := mergeOverwrite (dict) .Values.ingress.annotations .Values.ingress.paths.api.annotations }}
{{- if or (and .Values.frontendService.enabled .Values.ingress.paths.frontend.enabled) (and .Values.dashboardService.enabled .Values.ingress.paths.dashboard.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-app-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: banking-app
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.ingress.annotations }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
{{- end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- with .Values.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
{{- end }}
  rules:
    - {{- if $host }} host: {{ $host | quote }}{{- end }}
      http:
        paths:
{{- if and .Values.frontendService.enabled .Values.ingress.paths.frontend.enabled }}
          - path: {{ .Values.ingress.paths.frontend.path }}
            pathType: {{ .Values.ingress.paths.frontend.pathType }}
            backend:
              service:
                name: {{ .Values.frontendService.name }}
                port:
                  number: {{ .Values.frontendService.service.port }}
{{- end }}
{{- if and .Values.dashboardService.enabled .Values.ingress.paths.dashboard.enabled }}
          - path: {{ .Values.ingress.paths.dashboard.path }}
            pathType: {{ .Values.ingress.paths.dashboard.pathType }}
            backend:
              service:
                name: {{ .Values.dashboardService.name }}
                port:
                  number: {{ .Values.dashboardService.service.port }}
{{- end }}
{{- end }}
{{- if and .Values.apiService.enabled .Values.ingress.paths.api.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-api-ingress
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .Values.apiService.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if $apiAnnotations }}
  annotations:
{{ toYaml $apiAnnotations | indent 4 }}
{{- end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- with .Values.ingress.tls }}
  tls:
{{ toYaml . | indent 4 }}
{{- end }}
  rules:
    - {{- if $host }} host: {{ $host | quote }}{{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.paths.api.path }}
            pathType: {{ .Values.ingress.paths.api.pathType }}
            backend:
              service:
                name: {{ .Values.apiService.name }}
                port:
                  number: {{ .Values.apiService.service.port }}
{{- end }}
{{- end }}
