namespace: default

apiService:
  name: api-service
  replicaCount: 1
  image:
    repository: bankingappdev.azurecr.io/api-service
    tag: v5
    pullPolicy: IfNotPresent
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000

workerService:
  name: worker-service
  replicaCount: 1
  image:
    repository: bankingappdev.azurecr.io/worker-service
    tag: v4
    pullPolicy: IfNotPresent
  pollIntervalMs: "5000"


aiAnalyzerService:
  name: ai-analyzer-service
  replicaCount: 1
  image:
    repository: bankingappdev.azurecr.io/ai-analyzer-service
    tag: latest
  containerPort: 5000
  service:
    type: ClusterIP
    port: 5000 

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
