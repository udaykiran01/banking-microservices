apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: banking-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - banking-api:3000

      - job_name: worker-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - worker-service:4000
